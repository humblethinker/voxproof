name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reject private files and hardcoded credentials
        run: python scripts/check_public_files.py
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Backend tests (no API key needed)
        run: python -m pytest -q backend/tests
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Frontend tests and build
        run: |
          npm test --prefix web
          npm run build --prefix web
      - name: Audit JavaScript dependencies
        run: npm audit --prefix web --audit-level=moderate
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.lock.txt --no-deps --disable-pip

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
